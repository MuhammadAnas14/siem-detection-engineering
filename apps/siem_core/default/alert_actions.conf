# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/alert_actions.conf
#
# How a fired rule reaches a human. Three channels: email for the analyst
# queue, a webhook for whatever ticketing or SOAR system is downstream, and
# summary indexing so alert history outlives the raw data.
#
# Site-specific values (SMTP relay, recipient, webhook URL) are written to
# local/alert_actions.conf at deploy time. Credentials never belong here.
# ---------------------------------------------------------------------------

[email]
mailserver = smtp.example.com:25
use_ssl = 0
use_tls = 1
from = splunk-siem@example.com
to = soc@example.com
reportServerEnabled = 0

# Include the triggering rows in the mail body. An analyst who can triage
# from the notification does not need to open Splunk for every alert.
inline = 1
sendresults = 1
format = table
sendpdf = 0
maxresults = 100

# Rewritten at deploy time to the real web address, so the deep link in the
# mail actually resolves.
hostname = https://splunk.example.com:8000

subject = [SIEM] $name$ triggered ($job.resultCount$ results)
message.alert = Rule:      $name$\
Severity:  $alert.severity$\
Triggered: $trigger_date$ $trigger_time$\
Results:   $job.resultCount$\
\
$description$\
\
Open in Splunk: $results.url$
width_sort_columns = 1

[webhook]
# JSON POST carrying sid, search_name, app, owner, results_link and the first
# result row. Consumed downstream to open a ticket.
param.url = https://soc-portal.example.com/api/v1/alerts
enable_allowlist = 0

[summary_index]
# Every rule writes its results here. Keeps the trend dashboards cheap and
# means alert history is not lost when raw data ages out of its index.
_name = siem_summary
inline = 1

[rss]
disabled = 1

[populate_lookup]
disabled = 0
