# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/app.conf
#
# SOC content package: detection rules, dashboards, field extractions and the
# ATT&CK mapping, versioned together and deployed as one unit.
# ---------------------------------------------------------------------------

[install]
state = enabled
is_configured = 1
build = 1

[package]
id = siem_core
check_for_updates = false

[ui]
is_visible = 1
label = SIEM Core

[launcher]
author = Security Engineering
description = Detection content for Windows and Linux estates: correlation rules with ATT&CK mapping, SOC dashboards and platform health monitoring.
version = 1.0.0

[triggers]
# Reload knowledge objects in place instead of requiring a splunkd restart on
# every content change.
reload.savedsearches = simple
reload.macros = simple
reload.eventtypes = simple
reload.tags = simple
reload.transforms = simple
reload.props = simple
reload.mitre_attack_lookup = simple
