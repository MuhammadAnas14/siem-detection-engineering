# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/authorize.conf
#
# Two roles so the SOC can work the alert queue without holding admin. The
# split matters: an analyst who can edit detections can also silence them.
# ---------------------------------------------------------------------------

[role_soc_analyst]
importRoles = user

# Read-only, scoped to the security indexes.
srchIndexesAllowed = linux;linux_audit;windows;windows_audit;sysmon;dns_logs;web_logs;db_input;siem_summary
srchIndexesDefault = linux;windows;siem_summary
srchJobsQuota = 5
rtSrchJobsQuota = 2
srchDiskQuota = 200
srchMaxTime = 1800
cumulativeSrchJobsQuota = 20

# Enough to investigate and annotate; not enough to change what fires.
schedule_search = disabled
rtsearch = enabled
list_settings = enabled
edit_own_objects = enabled

[role_soc_engineer]
importRoles = soc_analyst

# Authors and tunes detection content.
schedule_search = enabled
edit_search_schedule_priority = enabled
edit_search_schedule_window = enabled
schedule_rtsearch = enabled
edit_search_server = enabled
srchJobsQuota = 10
rtSrchJobsQuota = 5
srchDiskQuota = 500
