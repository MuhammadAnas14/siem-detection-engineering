# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/collections.conf
#
# KV Store collection for per-rule triage state - owner, tuning date, running
# false-positive count. Kept out of the CSV lookup so analysts can record
# state from the UI without an app redeploy overwriting it.
# ---------------------------------------------------------------------------

[siem_rule_state]
enforceTypes = true
field.rule_id = string
field.enabled = bool
field.owner = string
field.last_tuned = time
field.false_positive_count = number
field.notes = string
accelerated_fields.rule_idx = {"rule_id": 1}
