# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/eventtypes.conf
#
# Named event classes. Dashboards and ad-hoc analyst searches refer to
# "windows_failed_logon" instead of repeating EventCode filters, and the tags
# in tags.conf hang off these names so CIM-aware apps can discover the data.
# ---------------------------------------------------------------------------

# --- Authentication ---------------------------------------------------------
[windows_failed_logon]
search = `windows_index` sourcetype="WinEventLog:Security" EventCode=4625
#tags = authentication failure

[windows_successful_logon]
search = `windows_index` sourcetype="WinEventLog:Security" EventCode=4624
#tags = authentication success

[linux_failed_logon]
search = `linux_index` sourcetype=linux_secure ("Failed password" OR "authentication failure")
#tags = authentication failure

[linux_successful_logon]
search = `linux_index` sourcetype=linux_secure ("Accepted password" OR "Accepted publickey")
#tags = authentication success

[root_session]
search = `linux_index` sourcetype=linux_secure "session * for user root"
#tags = privileged session

# --- Privilege / account management ----------------------------------------
[windows_special_privileges]
search = `windows_index` EventCode=4672
#tags = privileged

[windows_group_change]
search = `windows_index` (EventCode=4728 OR EventCode=4732 OR EventCode=4756)
#tags = account management

# --- Execution --------------------------------------------------------------
[powershell_scriptblock]
search = index=windows_audit source="WinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104
#tags = process execution

[sysmon_process_create]
search = index=sysmon EventCode=1
#tags = process execution

[windows_process_create]
search = `windows_index` EventCode=4688
#tags = process execution

# --- Persistence ------------------------------------------------------------
[windows_service_install]
search = `windows_index` EventCode=7045
#tags = persistence

[registry_autorun_change]
search = index=windows_audit sourcetype=WinRegistry key_path="*\\CurrentVersion\\Run*"
#tags = persistence

# --- Defence evasion --------------------------------------------------------
[windows_log_cleared]
search = `windows_index` (EventCode=1102 OR EventCode=104)
#tags = defense evasion

# --- Malware ----------------------------------------------------------------
[defender_detection]
search = `windows_index` (EventCode=1116 OR EventCode=1117)
#tags = malware attack

# --- File integrity ---------------------------------------------------------
[linux_file_permission_change]
search = `linux_index` sourcetype=linux_secure ("chmod" OR "chown" OR "chattr")
#tags = endpoint change

# --- Availability -----------------------------------------------------------
[host_shutdown]
search = (`windows_index` (EventCode=1074 OR EventCode=6006 OR EventCode=6008)) OR (`linux_index` "System is powering down")
#tags = availability

# --- Lateral movement -------------------------------------------------------
[smb_admin_share_access]
search = `windows_index` EventCode=5140 (Share_Name="*ADMIN$" OR Share_Name="*C$")
#tags = lateral movement
