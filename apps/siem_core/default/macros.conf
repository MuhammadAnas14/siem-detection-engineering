# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/macros.conf
#
# Detections reference indexes through macros rather than naming them
# directly. Onboarding a new index, splitting an estate or renaming one is
# then a single edit here instead of a sweep through every saved search.
# ---------------------------------------------------------------------------

[windows_index]
definition = (index=windows OR index=windows_audit)
iseval = 0

[linux_index]
definition = (index=linux OR index=linux_audit)
iseval = 0

[sysmon_index]
definition = index=sysmon
iseval = 0

[dns_index]
definition = index=dns_logs
iseval = 0

[web_index]
definition = index=web_logs
iseval = 0

# --- Enrichment -------------------------------------------------------------

# Attach the ATT&CK tactic/technique and the standard severity to a result set.
# Every detection calls this so an alert reaches the analyst already carrying
# its classification, rather than requiring a second lookup during triage.
[mitre_enrich(1)]
args = rule_id
definition = lookup mitre_attack_lookup rule_id AS $rule_id$ OUTPUT mitre_tactic_id, mitre_tactic, mitre_technique_id, mitre_technique, severity
iseval = 0

# Columns every alert hands to the downstream SOC tooling.
[soc_fields]
definition = eval alert_time=strftime(_time,"%Y-%m-%d %H:%M:%S %Z"), siem="splunk"
iseval = 0

# Machine and service accounts dominate Windows authentication and privilege
# events and are almost never the subject of an investigation. Excluding them
# centrally keeps the filter consistent across detections.
[exclude_service_accounts]
definition = search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE","DWM-*","UMFD-*","ANONYMOUS LOGON","$")
iseval = 0

# Outside business hours. Used to raise the priority of administrative
# activity that would be unremarkable during the working day.
[off_hours]
definition = eval hour=strftime(_time,"%H"), wday=strftime(_time,"%w") | where (hour<7 OR hour>19 OR wday="0" OR wday="6")
iseval = 0
