# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/props.conf
#
# Parsing rules per sourcetype.
#
# Detections reference user, src and host as ordinary fields. On Windows the
# TA supplies them; on Linux syslog and auth.log they do not exist until the
# extractions below run, so these are a prerequisite for the Linux rules
# rather than a convenience.
# ---------------------------------------------------------------------------

# ===========================================================================
# Linux - /var/log/auth.log and /var/log/secure
# ===========================================================================
[linux_secure]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_FORMAT = %b %d %H:%M:%S
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
category = Operating System
description = Linux authentication log (sshd, sudo, su, PAM)

REPORT-linux_auth = linux_sshd_auth, linux_sudo, linux_su, linux_pam_failure, linux_session
EXTRACT-syslog_proc = ^\w{3}\s+\d+\s[\d:]+\s+(?<host>[\w\-\.]+)\s+(?<process>[\w\-\/]+)(?:\[(?<pid>\d+)\])?:
EVAL-vendor_product = "Linux"
EVAL-app = "sshd"
FIELDALIAS-src_for_cim = src AS src_ip
LOOKUP-mitre_linux = mitre_attack_lookup rule_id OUTPUT mitre_tactic, mitre_technique

# ===========================================================================
# Linux - syslog
# ===========================================================================
[syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC
EXTRACT-syslog_header = ^\w{3}\s+\d+\s[\d:]+\s+(?<host>[\w\-\.]+)\s+(?<process>[\w\-\/]+)(?:\[(?<pid>\d+)\])?:\s*(?<message>.*)$
REPORT-shutdown = linux_shutdown_events

# ===========================================================================
# Linux - auditd
# ===========================================================================
[linux_audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = audit\(
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = auto
EXTRACT-audit_type = ^type=(?<type>\w+)
EXTRACT-audit_path = \bname="(?<name>[^"]+)"
EXTRACT-audit_exe  = \bexe="(?<exe>[^"]+)"
EXTRACT-audit_uid  = \bauid=(?<auid>\d+)
description = Linux auditd records and dmesg

# Scripted input from forwarders/linux/bin/linux_host_health.sh
[linux:hosthealth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
TIME_PREFIX = ^
category = Metrics

# ===========================================================================
# Windows
# ===========================================================================
[WinEventLog:Security]
TRANSFORMS-windows_null = windows_null_queue_noise
EVAL-os = "windows"
FIELDALIAS-user_for_cim = Account_Name AS user
FIELDALIAS-src_for_cim = Source_Network_Address AS src
EVAL-action = case(EventCode==4624,"success", EventCode==4625,"failure", EventCode==4634,"logoff", 1==1,null())

[WinEventLog:Microsoft-Windows-PowerShell/Operational]
EVAL-os = "windows"
FIELDALIAS-user_for_cim = UserID AS user
# Script block logging splits long scripts across MessageNumber/MessageTotal.
EXTRACT-sbt_part = Message(?<message_number>Number)=(?<msg_num>\d+)

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
KV_MODE = xml
EVAL-os = "windows"
FIELDALIAS-proc_for_cim = Image AS process_name
FIELDALIAS-cmd_for_cim = CommandLine AS process

[WinRegistry]
SHOULD_LINEMERGE = true
KV_MODE = auto
EVAL-os = "windows"

# Scripted input from forwarders/windows/bin/windows_host_health.ps1
[windows:hosthealth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TIME_PREFIX = ^
category = Metrics

# ===========================================================================
# Web access logs
# ===========================================================================
[access_combined]
SHOULD_LINEMERGE = false
REPORT-access_extractions = access_combined_fields
EVAL-uri_path = mvindex(split(uri,"?"),0)
EVAL-uri_query = if(match(uri,"\?"), mvindex(split(uri,"?"),1), null())

# ===========================================================================
# DNS
# ===========================================================================
[dns]
SHOULD_LINEMERGE = false
KV_MODE = json
EVAL-query_length = len(query)

# ===========================================================================
# Rows arriving over JDBC
# ===========================================================================
[mysql:auth_events]
SHOULD_LINEMERGE = false
KV_MODE = auto
INDEXED_EXTRACTIONS = csv
FIELD_DELIMITER = ,
TIMESTAMP_FIELDS = event_time
TIME_FORMAT = %Y-%m-%d %H:%M:%S
category = Database
