# ===========================================================================
# Initial access and exfiltration
# ===========================================================================

# Pattern-scoring rather than a single regex: stacked statements and
# out-of-band file access indicate the attacker is past probing, so they jump
# straight to critical regardless of how many other patterns matched.
[UC-15 SQL Injection Attempt]
search = `web_index` sourcetype=access_* (method=POST OR method=GET) \
| eval payload=urldecode(coalesce(form_data, uri_query, uri, _raw)) \
| eval p=lower(payload) \
| eval sig_union    = if(match(p, "union\s+(all\s+)?select"), 1, 0), \
       sig_tautology= if(match(p, "('|%27)\s*(or|and)\s*('|%27)?\s*\d+\s*=\s*\d+"), 1, 0), \
       sig_comment  = if(match(p, "(--|#|/\*)\s*$|;\s*--"), 1, 0), \
       sig_stacked  = if(match(p, ";\s*(drop|insert|update|delete|exec|truncate)\s"), 1, 0), \
       sig_meta     = if(match(p, "information_schema|sysobjects|pg_catalog|@@version|sqlite_master"), 1, 0), \
       sig_sleep    = if(match(p, "sleep\s*\(|benchmark\s*\(|waitfor\s+delay|pg_sleep"), 1, 0), \
       sig_oob      = if(match(p, "load_file\s*\(|into\s+outfile|xp_cmdshell"), 1, 0) \
| eval injection_score = sig_union + sig_tautology + sig_comment + sig_stacked + sig_meta + sig_sleep + sig_oob \
| where injection_score >= 1 \
| eval rule_id="UC-15", \
       severity=case(sig_stacked=1 OR sig_oob=1, "critical", injection_score>=2, "high", 1=1, "medium"), \
       blocked=if(status>=400 AND status<500, "likely blocked", "reached application") \
| stats count AS attempts, values(uri_path) AS targets, max(injection_score) AS max_score, \
        values(severity) AS severity, values(blocked) AS outcome, values(status) AS statuses \
        by clientip, rule_id \
| eval severity=mvindex(severity,0) \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, clientip, targets, attempts, max_score, statuses, outcome, severity, mitre_tactic_id, mitre_technique_id
description = SQL injection patterns in web request payloads - UNION SELECT, boolean tautologies, comment terminators, stacked statements, schema probing, time-based blind and out-of-band file access.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-15 SQL injection attempts from $result.clientip$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-15
alert.suppress.fields = clientip
alert.suppress.period = 900s


# Long hostnames alone are not suspicious - CDNs and anti-spam services use
# them constantly. Tunnelling shows up as long, high-entropy labels in high
# volume from one source, so all three conditions are required together.
[UC-09 DNS Tunnelling]
search = `dns_index` sourcetype=dns \
| rex field=_raw "data\"\s*:\s*\"(?<data>[^\"]+)" \
| eval query=coalesce(query, name, data) \
| eval data_length=len(query), \
       subdomain=mvindex(split(query,"."),0), \
       sub_len=len(mvindex(split(query,"."),0)), \
       label_count=mvcount(split(query,".")) \
| where data_length > 32 AND sub_len > 20 \
| eval distinct_chars=mvcount(mvdedup(split(lower(subdomain),""))) \
| eval entropy_proxy=round(distinct_chars/sub_len, 3) \
| where entropy_proxy > 0.45 \
| stats count AS queries, dc(query) AS unique_queries, \
        avg(data_length) AS avg_len, max(data_length) AS max_len, \
        values(mvindex(split(query,"."), label_count-2)) AS parent_domain \
        by src_ip \
| where queries > 50 AND unique_queries > 40 \
| eval rule_id="UC-09", severity="high", avg_len=round(avg_len,1) \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, src_ip, parent_domain, queries, unique_queries, avg_len, max_len, severity, mitre_tactic_id, mitre_technique_id
description = High-volume DNS queries carrying long, high-entropy subdomain labels from one source - the signature of a covert DNS channel.
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-09 Possible DNS tunnelling from $result.src_ip$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-09
alert.suppress.fields = src_ip
alert.suppress.period = 3600s


# ===========================================================================
# Defence evasion and impact
# ===========================================================================

# Protected system paths only. Watching every chmod on the estate alerts on
# every developer touching their own home directory and trains the SOC to
# ignore the rule.
[UC-04 File Integrity - Protected Paths]
search = (`linux_index` sourcetype=linux_secure ("chmod" OR "chown" OR "chattr")) \
      OR (`linux_index` sourcetype=linux_audit (type=PATH OR type=SYSCALL) (name="/etc/*" OR name="/bin/*" OR name="/sbin/*" OR name="/usr/bin/*" OR name="/boot/*")) \
| rex field=_raw "USER=(?<target_user>\S+).*?COMMAND=(?<command>.+)$" \
| rex field=_raw "sudo:\s+(?<user>\S+)\s*:" \
| eval target_path=coalesce(name, mvindex(split(command," "),-1)), \
       rule_id="UC-04", severity="medium" \
| search target_path IN ("/etc/*","/bin/*","/sbin/*","/usr/bin/*","/boot/*","/etc/passwd","/etc/shadow","/etc/sudoers") \
| stats count AS changes, values(command) AS commands, values(target_path) AS paths, \
        values(user) AS user by host, rule_id, severity \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, paths, commands, changes, severity, mitre_tactic_id, mitre_technique_id
description = Permission or ownership change against a protected system path on a Linux host.
