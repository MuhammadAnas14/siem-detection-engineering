# ===========================================================================
# Platform health
#
# A SIEM that stops receiving data fails silently: dashboards still render,
# rules still show as enabled, and nothing alerts because there is nothing to
# alert on. These rules monitor the pipeline itself.
# ===========================================================================

[OPS-01 Forwarder Stopped Sending Data]
search = | tstats latest(_time) AS last_seen WHERE index=linux OR index=windows OR index=linux_audit OR index=windows_audit BY host \
| eval minutes_silent = round((now() - last_seen) / 60, 1), \
       last_seen_human = strftime(last_seen, "%Y-%m-%d %H:%M:%S"), \
       status = case(minutes_silent > 60, "offline", minutes_silent > 15, "degraded", 1=1, "active") \
| where status != "active" \
| eval rule_id="OPS-01", severity=if(status=="offline","high","medium") \
| table last_seen_human, host, minutes_silent, status, severity
description = A host that was sending data has gone quiet for more than 15 minutes (degraded) or 60 minutes (offline).
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM][OPS] Forwarder $result.host$ is $result.status$

[OPS-02 Daily Ingestion Report]
search = | tstats count AS events WHERE index=linux OR index=windows OR index=linux_audit OR index=windows_audit OR index=db_input earliest=-24h BY index, host, sourcetype \
| stats sum(events) AS events, dc(sourcetype) AS sourcetypes BY index, host \
| eventstats sum(events) AS total_events \
| eval pct_of_total = round(events / total_events * 100, 2) \
| sort - events \
| rename index AS "Index", host AS "Host", events AS "Events (24h)", \
         sourcetypes AS "Sourcetypes", pct_of_total AS "% of volume"
description = Daily ingestion summary per index and host. A host whose volume drops sharply is usually a broken input rather than a quiet day.
cron_schedule = 0 6 * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
alert_type = always
action.email = 1
action.email.subject = [SIEM][OPS] Daily ingestion report
action.email.format = table
action.email.sendresults = 1
action.email.inline = 1

[OPS-03 License Usage Approaching Quota]
search = index=_internal source=*license_usage.log type=Usage \
| eval GB = b / 1024 / 1024 / 1024 \
| bin _time span=1d \
| stats sum(GB) AS daily_GB BY _time \
| eval quota_GB = 5, pct_used = round(daily_GB / quota_GB * 100, 1) \
| where pct_used > 80 \
| eval rule_id="OPS-03", severity=if(pct_used>95,"high","medium") \
| table _time, daily_GB, quota_GB, pct_used, severity
description = Daily indexed volume exceeded 80% of the licensed quota. Exceeding the quota repeatedly disables search, so this needs acting on before it happens. Set quota_GB to match the licence.
