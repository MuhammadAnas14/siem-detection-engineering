action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-14
alert.suppress.period = 60s


# Two independent triggers. The extension list catches known families
# immediately; the volume heuristic - one process rewriting a hundred distinct
# files into a handful of extensions - catches families whose extension nobody
# has published yet, which is the case that matters.
[UC-13 Ransomware Behaviour]
search = `windows_index` sourcetype="WinEventLog:Security" EventCode=4663 \
| rex field=Object_Name "\\\\(?<filename>[^\\\\]+)$" \
| rex field=filename "\.(?<extension>[A-Za-z0-9_\-]+)$" \
| eval user=coalesce(user, Account_Name), \
       proc=coalesce(Process_Name, "Process Name"), \
       known_ransom_ext=if(match(lower(filename), "\.(encrypted|locked|crypt|crypto|cerber|locky|wncry|wcry|ryk|ryuk|conti|lockbit|revil|sodinokibi|djvu|enc)$"), 1, 0) \
| bin _time span=5m \
| stats count AS file_ops, dc(filename) AS distinct_files, \
        sum(known_ransom_ext) AS ransom_ext_hits, \
        dc(extension) AS distinct_exts, values(extension) AS extensions \
        by _time, host, user, proc \
| where ransom_ext_hits > 0 OR (distinct_files > 100 AND distinct_exts <= 3) \
| eval rule_id="UC-13", \
       trigger=if(ransom_ext_hits>0, "known ransomware extension", "mass file rewrite"), \
       severity="critical" \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, proc, trigger, distinct_files, ransom_ext_hits, extensions, severity, mitre_tactic_id, mitre_technique_id
description = Files renamed to a known ransomware extension, or one process rewriting 100+ distinct files into few extensions within five minutes. Requires object access auditing.
