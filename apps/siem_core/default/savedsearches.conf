# Clearing the audit log destroys the evidence of whatever preceded it, so
# this fires in real time with minimal suppression - a second clearance is
# itself information. There is no benign reason for this on a production host.
[UC-14 Audit Log Tampering]
search = (`windows_index` source="WinEventLog:Security" (EventCode=1102 OR EventCode=104 OR EventCode=4719)) \
      OR (`windows_index` EventCode=4688 New_Process_Name="*\\wevtutil.exe" Process_Command_Line="*cl *") \
| eval user=coalesce(user, Account_Name, SubjectUserName), \
       action=case(EventCode=1102, "security audit log cleared", \
                   EventCode=104,  "event log cleared", \
                   EventCode=4719, "system audit policy changed", \
                   1=1,            "wevtutil clear-log executed") \
| eval rule_id="UC-14", severity="critical", \
       signature=coalesce(signature, action) \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, action, signature, severity, mitre_tactic_id, mitre_technique_id
description = Security or system event log cleared, audit policy altered, or wevtutil clear-log executed - anti-forensics.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
