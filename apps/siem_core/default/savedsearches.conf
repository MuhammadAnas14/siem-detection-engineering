# ===========================================================================
# $SPLUNK_HOME/etc/apps/siem_core/default/savedsearches.conf
#
# Detection content. Each rule carries:
#   * a rule_id (UC-nn) that joins to lookups/mitre_attack_lookup.csv for its
#     ATT&CK tactic/technique and SOC 2 control;
#   * a severity (low / medium / high / critical);
#   * suppression keyed on the fields that identify "the same thing happening
#     again", so a sustained attack produces one actionable alert and not a
#     thousand;
#   * summary indexing into siem_summary, so alert history survives
#     independently of the raw data's retention and the trend dashboards stay
#     cheap to render.
#
# Rules fire on a cron schedule unless detection latency genuinely matters, in
# which case they run real-time. Real-time searches hold a scheduler slot for
# their whole lifetime, so they are used sparingly - see limits.conf.
#
# alert.severity:  2 = low, 3 = medium, 4 = high, 5 = critical
#
# Tune in local/savedsearches.conf, never here: default/ is overwritten on
# every redeploy.
# ===========================================================================

[default]
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
quantity = 0
relation = greater than
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 300s
request.ui_dispatch_app = siem_core
request.ui_dispatch_view = search


# ===========================================================================
# Credential access
# ===========================================================================

# Counting failed logons alone produces an alert for every mistyped password
# and every stale service credential. Correlating the failures with a
# subsequent success in the same window is what separates "someone is
# guessing" from "someone got in", and only the latter warrants a page.
[UC-01 Brute Force - Windows]
search = `windows_index` source="WinEventLog:Security" (EventCode=4625 OR EventCode=4624) \
| eval user=coalesce(user, Account_Name), src=coalesce(src, src_ip, Source_Network_Address) \
| `exclude_service_accounts` \
| bin _time span=5m \
| stats count(eval(EventCode=4625)) AS failures, \
        count(eval(EventCode=4624)) AS successes, \
        values(src) AS src, dc(src) AS distinct_sources \
        by _time, user, host \
| where failures >= 5 \
| eval rule_id="UC-01", \
       outcome=if(successes>0, "compromised - successful logon after brute force", "brute force attempt"), \
       severity=if(successes>0, "high", "medium") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, src, failures, successes, outcome, severity, mitre_tactic_id, mitre_technique_id
description = Five or more failed Windows logons for one account within five minutes. Escalates to high when a successful logon follows in the same window.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM][MEDIUM] UC-01 Windows brute force on $result.host$
action.email.include.results_link = 1
action.email.format = table
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-01
alert.suppress.fields = host,user
alert.suppress.period = 900s


# sshd writes the account and source address into the message body, so the
# regex below is doing the work the Windows TA does for free. The permanent
# extraction in transforms.conf covers ad-hoc searching; this one keeps the
# rule self-contained and able to run on a host where the app's props have not
# been reloaded yet.
[UC-02 Brute Force - Linux SSH]
search = `linux_index` sourcetype=linux_secure ("Failed password" OR "Accepted password" OR "Accepted publickey") \
| rex field=_raw "(?<auth_result>Failed|Accepted)\s+(?<auth_method>password|publickey)\s+for\s+(?:invalid user\s+)?(?<user>\S+)\s+from\s+(?<src>\d+\.\d+\.\d+\.\d+)\s+port\s+(?<src_port>\d+)" \
| bin _time span=5m \
| stats count(eval(auth_result=="Failed"))   AS failures, \
        count(eval(auth_result=="Accepted")) AS successes, \
        values(src) AS src, dc(src) AS distinct_sources \
        by _time, user, host \
| where failures >= 5 \
| eval rule_id="UC-02", \
       outcome=if(successes>0, "compromised - SSH session after brute force", "SSH brute force attempt"), \
       severity=if(successes>0, "high", "medium") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, src, distinct_sources, failures, successes, outcome, severity, mitre_tactic_id, mitre_technique_id
description = Five or more failed SSH authentications for one account within five minutes. Escalates to high when a successful authentication follows.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM][MEDIUM] UC-02 SSH brute force on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-02
alert.suppress.fields = host,user
alert.suppress.period = 900s


# Distinguishes password spraying from brute force: many accounts, few
# attempts each, which stays under per-account lockout thresholds. Grouping by
# account and escalating on critical infrastructure keeps the noise down.
[UC-08 Repeated Authentication Failures - Linux]
search = `linux_index` sourcetype=linux_secure ("authentication failure" OR "Failed password" OR "Invalid user" OR "FAILED su") \
| rex field=_raw "(?:user=|for\s+(?:invalid user\s+)?)(?<user>[\w\-\.$]+)" \
| rex field=_raw "rhost=(?<src>\S+)" \
| eval rule_id="UC-08", \
       critical_host=if(match(host, "(?i)(db|dc|vault|jump|bastion|prod)"), "yes", "no") \
| stats count AS failures, dc(src) AS distinct_sources, values(src) AS sources, \
        values(host) AS hosts, values(critical_host) AS critical \
        by user, rule_id \
| where failures >= 3 \
| eval severity=case(critical="yes" AND failures>=10, "high", \
                     failures>=10, "medium", \
                     1=1, "low") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, user, hosts, sources, distinct_sources, failures, critical, severity, mitre_tactic_id, mitre_technique_id
description = Repeated PAM authentication failures grouped by account. Escalated when the target host looks like critical infrastructure.
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM] UC-08 Authentication failures for $result.user$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-08
alert.suppress.fields = user
alert.suppress.period = 900s


# ===========================================================================
# Privilege escalation
# ===========================================================================

# EventCode 4672 fires for SYSTEM on every boot and for every service logon.
# Unfiltered it is one of the highest-volume events on the estate and carries
# no signal; filtered to interactive, non-machine accounts it is a useful
# record of who exercised administrative rights and when.
[UC-03 Administrative Privilege Assignment]
search = `windows_index` EventCode=4672 \
| eval user=coalesce(user, Account_Name) \
| `exclude_service_accounts` \
| search NOT user="*$" \
| stats count AS privilege_grants, values(host) AS hosts, \
        earliest(_time) AS first_seen, latest(_time) AS last_seen \
        by user \
| eval rule_id="UC-03", severity="medium" \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, user, hosts, privilege_grants, severity, mitre_tactic_id, mitre_technique_id
description = Special privileges (SeDebug, SeTakeOwnership, SeTcb) assigned to a non-service account at logon.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
dispatch.rt_backfill = 1
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM][MEDIUM] UC-03 Privilege escalation - $result.user$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-03
alert.suppress.fields = user
alert.suppress.period = 600s


# Adding a user to a distribution list is routine; adding one to Domain Admins
# is not. Filtering on group name is what makes this rule worth paging on.
[UC-12 Privileged Group Membership Change]
search = `windows_index` (EventCode=4728 OR EventCode=4732 OR EventCode=4756) \
| eval group=coalesce(Group_Name, "Group Name", TargetUserName), \
       member=coalesce(Member_Name, "Member Name"), \
       actor=coalesce(Account_Name, SubjectUserName), \
       scope=case(EventCode=4728,"global", EventCode=4732,"local", EventCode=4756,"universal") \
| eval privileged=if(match(lower(group), "admin|domain admins|enterprise admins|schema admins|backup operators|account operators"), "yes", "no") \
| search privileged="yes" \
| stats count AS changes, values(member) AS members_added, values(host) AS hosts \
        by group, actor, scope \
| eval rule_id="UC-12", severity="high" \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, group, scope, actor, members_added, changes, hosts, severity, mitre_tactic_id, mitre_technique_id
description = An account was added to a privileged Windows group - Domain Admins, Enterprise Admins, local Administrators, Backup Operators or similar.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-12 $result.members_added$ added to $result.group$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-12
alert.suppress.fields = group,actor
alert.suppress.period = 600s


# Root sessions should be rare and attributable. Recording who escalated, by
# what mechanism, gives the audit trail that sudo alone does not when an
# attacker has already obtained a shell.
[UC-17 Root Session Activity]
search = `linux_index` sourcetype=linux_secure ("session closed for user root" OR "session opened for user root") \
| rex field=_raw "session (?<session_action>opened|closed) for user (?<target_user>\S+)(?: by (?<by_user>[\w\-\.]+))?" \
| rex field=_raw "(?<pam_module>pam_unix\(\S+\))" \
| where target_user="root" \
| eval rule_id="UC-17", severity="high", \
       by_user=coalesce(by_user, "unknown"), \
       service=case(match(pam_module,"sshd"),"ssh", match(pam_module,"sudo"),"sudo", match(pam_module,"su"),"su", 1=1,"other") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, session_action, target_user, by_user, service, severity, mitre_tactic_id, mitre_technique_id
description = A root session was opened or closed on a Linux host, with the escalating account and mechanism.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-17 Root session $result.session_action$ on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-17
alert.suppress.period = 60s


# ===========================================================================
# Execution
# ===========================================================================

# Any single PowerShell flag has legitimate uses - installers run with
# -noprofile, management scripts download files. It is the combination that
# is diagnostic, so indicators are scored rather than matched individually and
# the severity tracks how many fired together.
[UC-05 Suspicious PowerShell Execution]
search = `windows_index` source="WinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104 \
| eval sbt=lower(ScriptBlockText) \
| eval ind_bypass    = if(match(sbt, "-ep\s+bypass|executionpolicy\s+bypass|-exec\s+bypass"), 1, 0), \
       ind_noprofile = if(match(sbt, "-nop(rofile)?\b"), 1, 0), \
       ind_hidden    = if(match(sbt, "-w(indowstyle)?\s+hidden"), 1, 0), \
       ind_download  = if(match(sbt, "downloadstring|downloadfile|invoke-webrequest|start-bitstransfer|net\.webclient"), 1, 0), \
       ind_encoded   = if(match(sbt, "-enc(odedcommand)?\b|frombase64string"), 1, 0), \
       ind_iex       = if(match(sbt, "iex\b|invoke-expression"), 1, 0) \
| eval indicator_score = ind_bypass + ind_noprofile + ind_hidden + ind_download + ind_encoded + ind_iex \
| where indicator_score >= 2 \
| eval rule_id="UC-05", \
       severity=case(indicator_score>=4, "high", indicator_score=3, "medium", 1=1, "low"), \
       user=coalesce(user, UserID, Account_Name) \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, Computer, user, indicator_score, severity, ScriptBlockText, mitre_tactic_id, mitre_technique_id
description = PowerShell script block combining two or more abuse indicators - execution-policy bypass, -noprofile, hidden window, remote download, base64 encoding or Invoke-Expression. Requires Script Block Logging.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-05 Suspicious PowerShell on $result.Computer$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-05
alert.suppress.fields = Computer
alert.suppress.period = 300s


# Offensive PowerShell frameworks share a small set of structural traits:
# a web-client stager, hidden encoded launchers, large base64 payloads, AES
# beacon crypto and AMSI bypasses. Matching the family rather than one
# published string survives trivial obfuscation.
[UC-16 Offensive PowerShell Framework Indicators]
search = `windows_index` (sourcetype="WinEventLog:Microsoft-Windows-PowerShell" OR sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational") \
| eval payload=lower(coalesce(ScriptBlockText, Message, _raw)) \
| eval emp_stager   = if(match(payload, "iex\s*\(\s*new-object\s+net\.webclient\s*\)\s*\.downloadstring"), 1, 0), \
       emp_launcher = if(match(payload, "-nop\s+-sta\s+-w\s+hidden\s+-enc|-noni\s+-nop\s+-w\s+hidden"), 1, 0), \
       emp_b64      = if(match(payload, "frombase64string\s*\(\s*['\"][a-z0-9+/=]{100,}"), 1, 0), \
       emp_aes      = if(match(payload, "system\.security\.cryptography\.aes|rijndaelmanaged"), 1, 0), \
       emp_beacon   = if(match(payload, "servicename\s*=\s*['\"]|\$wc\.headers\.add\(['\"]cookie"), 1, 0), \
       emp_amsi     = if(match(payload, "amsiutils|amsiinitfailed|\[ref\]\.assembly\.gettype"), 1, 0) \
| eval framework_score = emp_stager + emp_launcher + emp_b64 + emp_aes + emp_beacon + emp_amsi \
| where framework_score >= 1 \
| eval rule_id="UC-16", \
       severity=if(framework_score>=2 OR emp_stager=1, "critical", "high"), \
       user=coalesce(user, UserID, Account_Name), \
       indicators=mvjoin(mvfilter(match(mvappend( \
           if(emp_stager=1,"webclient-downloadstring",null()), \
           if(emp_launcher=1,"hidden-encoded-launcher",null()), \
           if(emp_b64=1,"large-base64-blob",null()), \
           if(emp_aes=1,"aes-crypto",null()), \
           if(emp_beacon=1,"http-beacon-headers",null()), \
           if(emp_amsi=1,"amsi-bypass",null())), ".")), ", ") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, framework_score, indicators, severity, mitre_tactic_id, mitre_technique_id
description = Structural indicators of an offensive PowerShell framework - web-client stager, hidden encoded launcher, large base64 payload, AES beacon crypto or AMSI bypass.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
action.email = 1
action.email.subject = [SIEM][CRITICAL] UC-16 Offensive PowerShell on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-16
alert.suppress.fields = host
alert.suppress.period = 300s


# certutil is signed, present on every Windows host and allowlisted almost
# everywhere, which is exactly why it is used to fetch and decode payloads.
# Reads Sysmon where it is deployed and falls back to 4688 process creation
# where it is not, so coverage does not depend on a complete Sysmon rollout.
[UC-10 LOLBin Download via CertUtil]
search = ( `sysmon_index` EventCode=1 process_name=certutil.exe ) \
      OR ( `windows_index` EventCode=4688 New_Process_Name="*\\certutil.exe" ) \
| eval cmdline=lower(coalesce(process, CommandLine, Process_Command_Line)) \
| search cmdline="*urlcache*" OR cmdline="*-decode*" OR cmdline="*-encode*" OR cmdline="*verifyctl*" \
| eval technique=case(match(cmdline,"urlcache.*split"), "download via urlcache", \
                      match(cmdline,"-decode"),         "base64 decode of staged payload", \
                      match(cmdline,"-encode"),         "base64 encode for exfiltration", \
                      match(cmdline,"verifyctl"),       "download via verifyctl", \
                      1=1, "certutil misuse") \
| rex field=cmdline "(?<url>https?://[^\s\"]+)" \
| eval rule_id="UC-10", severity="high", \
       user=coalesce(user, User, Account_Name) \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, user, parent_process_name, technique, url, cmdline, severity, mitre_tactic_id, mitre_technique_id
description = certutil.exe invoked with -urlcache, -decode, -encode or verifyctl - living-off-the-land download and payload staging.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-10 CertUtil abuse on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-10
alert.suppress.fields = host,user
alert.suppress.period = 600s


# A detection that fires only after the endpoint agent already caught
# something is still worth having: it is the signal that an endpoint needs
# attention, and a detection with no remediation recorded is an active
# infection rather than a cleaned one.
[UC-07 Endpoint Malware Detection]
search = `windows_index` (EventCode=1116 OR EventCode=1117 OR EventCode=1006) \
| eval threat=coalesce(VirusName, Threat_Name, "Threat Name"), \
       target=coalesce(ComputerName, host), \
       action_taken=case(EventCode=1117,"remediated", EventCode=1116,"detected", 1=1,"detected") \
| stats count AS detections, values(action_taken) AS actions, \
        values(Path) AS paths, latest(_time) AS last_seen \
        by threat, target \
| eval rule_id="UC-07", \
       severity=if(isnull(mvfind(actions,"remediated")), "high", "medium") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, target, threat, detections, actions, paths, severity, mitre_tactic_id, mitre_technique_id
description = Endpoint protection reported malware. High severity when no remediation action was recorded, meaning the threat may still be resident.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-07 Malware detected: $result.threat$ on $result.target$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-07
alert.suppress.fields = target,threat
alert.suppress.period = 1800s


# ===========================================================================
# Persistence
# ===========================================================================

# Services installed from %SystemRoot% or %ProgramFiles% are overwhelmingly
# legitimate. Anything registering a service from a user-writable directory
# is worth looking at, and a path under temp, appdata or public raises it
# further.
[UC-06 Service Installed From Unusual Path]
search = `windows_index` EventCode=7045 \
| eval svc_path=lower(coalesce(Service_File_Name, Service_Name, Image_Path)) \
| search NOT (svc_path IN ("c:\\windows\\*", "c:\\program files*", "c:\\program files (x86)\\*")) \
| eval rule_id="UC-06", severity="high", \
       user=coalesce(user, Account_Name), \
       suspicious_path=if(match(svc_path, "\\\\(temp|tmp|appdata|users\\\\public|programdata|downloads)\\\\"), "yes", "no") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, Service_Name, Service_File_Name, Service_Start_Type, user, suspicious_path, severity, mitre_tactic_id, mitre_technique_id
description = A Windows service was installed from a path outside %SystemRoot% and %ProgramFiles% - a common persistence and lateral-movement footprint.
dispatch.earliest_time = rt-5m
dispatch.latest_time = rt
realtime_schedule = 1
cron_schedule = * * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
action.email = 1
action.email.subject = [SIEM][HIGH] UC-06 Service installed from unusual path on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-06
alert.suppress.fields = host,Service_Name
alert.suppress.period = 600s


# Winlogon and IFEO hijacks run before or instead of the program the user
# launched, so they rank above ordinary autorun keys.
[UC-18 Registry Persistence Key Modified]
search = (`windows_index` sourcetype=WinRegistry) \
      OR (`sysmon_index` (EventCode=12 OR EventCode=13 OR EventCode=14)) \
| eval key=lower(coalesce(key_path, TargetObject, registry_path)), \
       value=coalesce(data, Details, registry_value_data), \
       action=coalesce(action, registry_value_type, EventType) \
| search key="*\\currentversion\\run*" OR key="*\\currentversion\\runonce*" \
      OR key="*\\currentcontrolset\\services*" OR key="*\\winlogon\\shell*" \
      OR key="*\\winlogon\\userinit*" OR key="*\\image file execution options*" \
| eval rule_id="UC-18", \
       persistence_type=case(match(key,"\\\\run(once)?\\\\"), "autorun key", \
                             match(key,"services"),           "service registration", \
                             match(key,"winlogon"),           "winlogon hijack", \
                             match(key,"image file execution"), "IFEO debugger hijack", \
                             1=1, "registry change"), \
       severity=if(match(key,"winlogon|image file execution"), "high", "medium") \
| stats count AS changes, values(value) AS values, values(process_name) AS processes \
        by host, key, persistence_type, severity, rule_id \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, key, persistence_type, values, processes, changes, severity, mitre_tactic_id, mitre_technique_id
description = Modification of a Windows persistence registry key - Run/RunOnce, service registration, Winlogon Shell/Userinit, or Image File Execution Options debugger.
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
action.email = 1
action.email.subject = [SIEM] UC-18 Registry persistence change on $result.host$
action.webhook = 1
action.summary_index = 1
action.summary_index._name = siem_summary
action.summary_index.rule_id = UC-18
alert.suppress.fields = host,key
alert.suppress.period = 1800s


# ===========================================================================
# Lateral movement
# ===========================================================================

# Admin-share access is how remote-execution tooling moves between hosts. One
# administrator touching one server is routine; one account reaching several
# in a short window is the pattern worth escalating.
[UC-11 Administrative Share Access]
search = `windows_index` sourcetype="WinEventLog:Security" EventCode=5140 \
| eval share=coalesce(Share_Name, Object_Name) \
| search share="*\\ADMIN$" OR share="*\\C$" OR share="*\\IPC$" \
| eval user=coalesce(user, Account_Name), \
       src=coalesce(src, Source_Address, Source_Network_Address) \
| `exclude_service_accounts` \
| search NOT src IN ("127.0.0.1","::1","-") \
| stats count AS accesses, values(share) AS shares, values(host) AS targets, \
        dc(host) AS distinct_targets, earliest(_time) AS first_seen \
        by user, src \
| eval rule_id="UC-11", \
       severity=if(distinct_targets>2, "high", "medium") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, user, src, targets, distinct_targets, shares, accesses, severity, mitre_tactic_id, mitre_technique_id
description = Remote access to ADMIN$, C$ or IPC$ shares. Escalates when one account reaches more than two hosts, which is the signature of tool-driven lateral movement.
