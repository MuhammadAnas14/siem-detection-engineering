# The failure mode this catches: a rule shows as enabled in the UI while the
# scheduler quietly drops every execution because no slot was free.
[OPS-04 Detection Rule Being Skipped]
search = index=_internal sourcetype=scheduler (status=skipped OR status=deferred) app=siem_core \
| stats count AS skips, values(reason) AS reasons BY savedsearch_name, status \
| where skips > 3 \
| eval rule_id="OPS-04", severity="medium" \
| table savedsearch_name, status, skips, reasons, severity
description = A detection rule was skipped or deferred by the scheduler more than three times - the rule is enabled but not actually running.
