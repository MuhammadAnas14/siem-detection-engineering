# Low severity by default because planned restarts are routine. Unexpected
# shutdowns and kernel power losses are separated out because those are either
# a hardware problem or someone covering their tracks.
[UC-19 Host Shutdown or Restart]
search = (`windows_index` (EventCode=1074 OR EventCode=6006 OR EventCode=6008 OR EventCode=41)) \
      OR (`linux_index` sourcetype=syslog ("systemd-logind: System is powering down" OR "shutdown[" OR "reboot: Restarting system")) \
| eval os=if(isnotnull(EventCode), "windows", "linux"), \
       shutdown_type=case(EventCode=1074, "planned shutdown/restart", \
                          EventCode=6006, "clean service stop", \
                          EventCode=6008, "UNEXPECTED shutdown", \
                          EventCode=41,   "kernel power loss", \
                          match(_raw, "reboot: Restarting"), "reboot", \
                          1=1, "shutdown"), \
       user=coalesce(user, Account_Name, "system"), \
       reason=coalesce(Reason, "Reason Code", "n/a") \
| eval rule_id="UC-19", \
       severity=if(match(shutdown_type, "UNEXPECTED|power loss"), "high", "low") \
| `mitre_enrich(rule_id)` \
| `soc_fields` \
| table alert_time, rule_id, host, os, shutdown_type, user, reason, severity, mitre_tactic_id, mitre_technique_id
description = A monitored host shut down or restarted. Unexpected shutdowns and kernel power losses are raised to high; planned restarts are informational.
