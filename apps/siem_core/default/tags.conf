# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/tags.conf
# CIM-compatible tags on the eventtypes in eventtypes.conf.
#
# These are what let CIM-aware apps (Enterprise Security, Security
# Essentials, the ATT&CK app) discover this data without per-rule
# registration, and what makes the data model accelerations usable later.
# ---------------------------------------------------------------------------

[eventtype=windows_failed_logon]
authentication = enabled
failure = enabled

[eventtype=windows_successful_logon]
authentication = enabled
success = enabled

[eventtype=linux_failed_logon]
authentication = enabled
failure = enabled

[eventtype=linux_successful_logon]
authentication = enabled
success = enabled

[eventtype=root_session]
authentication = enabled
privileged = enabled

[eventtype=windows_special_privileges]
privileged = enabled
authentication = enabled

[eventtype=windows_group_change]
account = enabled
management = enabled
change = enabled

[eventtype=powershell_scriptblock]
process = enabled
report = enabled

[eventtype=sysmon_process_create]
process = enabled
report = enabled

[eventtype=windows_process_create]
process = enabled
report = enabled

[eventtype=windows_service_install]
service = enabled
report = enabled
change = enabled

[eventtype=registry_autorun_change]
registry = enabled
change = enabled

[eventtype=windows_log_cleared]
change = enabled
audit = enabled

[eventtype=defender_detection]
malware = enabled
attack = enabled

[eventtype=linux_file_permission_change]
change = enabled
endpoint = enabled

[eventtype=host_shutdown]
change = enabled
system = enabled

[eventtype=smb_admin_share_access]
network = enabled
resolution = enabled
