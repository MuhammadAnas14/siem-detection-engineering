# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/siem_core/default/transforms.conf
# Field extractions referenced by props.conf, index-time filtering, and the
# lookup definitions the enrichment macros call.
# ---------------------------------------------------------------------------

# ===========================================================================
# Linux authentication
#
# sshd, sudo, su and PAM each use a different message layout, so each gets its
# own extraction rather than one regex trying to cover all of them.
# ===========================================================================

# "Failed password for invalid user admin from 10.0.0.5 port 44321 ssh2"
# "Accepted publickey for ubuntu from 10.0.0.9 port 51002 ssh2"
[linux_sshd_auth]
REGEX = (?<auth_result>Failed|Accepted)\s+(?<auth_method>password|publickey|none)\s+for\s+(?:(?<invalid_user>invalid user)\s+)?(?<user>[^\s]+)\s+from\s+(?<src>[\d\.a-fA-F:]+)\s+port\s+(?<src_port>\d+)
FORMAT = auth_result::$1 auth_method::$2 invalid_user::$3 user::$4 src::$5 src_port::$6

# "sudo:   alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/bin/chmod 777 /etc/passwd"
[linux_sudo]
REGEX = sudo:\s+(?<user>[\w\-\.]+)\s*:\s*TTY=(?<tty>\S+)\s*;\s*PWD=(?<pwd>\S+)\s*;\s*USER=(?<target_user>\S+)\s*;\s*COMMAND=(?<command>.+)$
FORMAT = user::$1 tty::$2 pwd::$3 target_user::$4 command::$5

# "FAILED su for root by alice"
[linux_su]
REGEX = (?<su_result>FAILED su|su)\s+for\s+(?<target_user>\S+)\s+by\s+(?<user>\S+)
FORMAT = su_result::$1 target_user::$2 user::$3

# "pam_unix(sshd:auth): authentication failure; logname= uid=0 ... rhost=10.0.0.5 user=root"
[linux_pam_failure]
REGEX = (?<pam_module>pam_\w+\([^\)]+\)):\s+authentication failure;.*?(?:rhost=(?<src>\S+))?\s*(?:user=(?<user>\S+))?
FORMAT = pam_module::$1 src::$2 user::$3

# "session opened for user root by alice(uid=1000)" / "session closed for user root"
[linux_session]
REGEX = session\s+(?<session_action>opened|closed)\s+for\s+user\s+(?<target_user>\S+?)(?:\s+by\s+(?<by_user>[\w\-\.]+))?(?:\(uid=(?<by_uid>\d+)\))?\s*$
FORMAT = session_action::$1 target_user::$2 by_user::$3 by_uid::$4

# Shutdown / reboot lines
[linux_shutdown_events]
REGEX = (?<shutdown_signal>System is powering down|Restarting system|Stopped target|shutdown scheduled)
FORMAT = shutdown_signal::$1

# ===========================================================================
# Web access log
# ===========================================================================
[access_combined_fields]
REGEX = ^(?<clientip>\S+)\s+\S+\s+(?<auth_user>\S+)\s+\[(?<req_time>[^\]]+)\]\s+"(?<method>\w+)\s+(?<uri>\S+)\s+(?<http_version>[^"]+)"\s+(?<status>\d{3})\s+(?<bytes>\d+|-)
FORMAT = clientip::$1 auth_user::$2 req_time::$3 method::$4 uri::$5 http_version::$6 status::$7 bytes::$8

# ===========================================================================
# Index-time routing / filtering
# ===========================================================================

# Noise control. 4634 (logoff), 4658 (handle closed) and the 5156/5158 filter
# events routinely account for the majority of Windows event volume while
# supporting no detection here. Dropping them at index time is the single
# largest licence saving available on a Windows estate.
#
# Removing an EventCode from this list is how you re-enable it - but confirm
# nothing depends on it first, because nullQueue data is gone, not hidden.
[windows_null_queue_noise]
REGEX = (?m)^EventCode=(4634|4658|4659|5156|5158)$
DEST_KEY = queue
FORMAT = nullQueue

# ===========================================================================
# Lookup definitions
# ===========================================================================
[mitre_attack_lookup]
filename = mitre_attack_lookup.csv
case_sensitive_match = false
max_matches = 1

# Severity to colour, SLA and escalation path. Driven from a lookup so the
# SLA can change without editing every dashboard.
[severity_lookup]
filename = severity_lookup.csv
case_sensitive_match = false
max_matches = 1
