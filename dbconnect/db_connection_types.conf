# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/splunk_app_db_connect/local/db_connection_types.conf
#
# DB Connect ships connection types for most databases but the JDBC driver
# JARs are not redistributable, so they must be placed manually in:
#   $SPLUNK_HOME/etc/apps/splunk_app_db_connect/drivers/
# ---------------------------------------------------------------------------

[mysql]
displayName = MySQL
serviceClass = com.splunk.dbx2.MySQLJDBC
jdbcDriverClass = com.mysql.cj.jdbc.Driver
jdbcUrlFormat = jdbc:mysql://<host>:<port>/<database>
jdbcUrlSSLFormat = jdbc:mysql://<host>:<port>/<database>?useSSL=true&requireSSL=true&verifyServerCertificate=false
port = 3306
testQuery = SELECT 1
ui_default_catalog_enabled = false
supportedVersions = 5.7,8.0,8.4

[mssql]
displayName = MS-SQL Server Using MS Generic Driver
serviceClass = com.splunk.dbx2.MSSQLServerJDBC
jdbcDriverClass = com.microsoft.sqlserver.jdbc.SQLServerDriver
jdbcUrlFormat = jdbc:sqlserver://<host>:<port>;databaseName=<database>;encrypt=true;trustServerCertificate=true
port = 1433
testQuery = SELECT 1
supportedVersions = 2016,2017,2019,2022
