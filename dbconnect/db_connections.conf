# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/splunk_app_db_connect/local/db_connections.conf
#
# Database connections.
#
# Passwords are NOT stored here - this file references an identity by name
# only. DB Connect encrypts the credential against the instance's
# splunk.secret, which also means a credential file is not portable between
# instances. install/06_setup_dbconnect.sh provisions the identity over REST
# so the password is never written to disk in plaintext.
#
# Every connection is readonly: the SIEM has no business writing to a
# monitored database, and a compromised Splunk instance should not become a
# path to modifying the audit trail it is reading.
# ---------------------------------------------------------------------------

[mysql_appdb]
connection_type = mysql
host = 10.20.30.40
port = 3306
database = appdb
identity = mysql_splunk_ro
jdbcUseSSL = true
readonly = true
timezone = UTC
fetch_size = 1000
isolation_level = READ_COMMITTED
localTimezoneConversionEnabled = true
customizedJdbcUrl = jdbc:mysql://10.20.30.40:3306/appdb?useSSL=true&verifyServerCertificate=false&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC

# ---------------------------------------------------------------------------
# SQL Server. Ships disabled: enable once install/06_setup_dbconnect.sh
# reports TCP/1433 reachable from the Splunk host. Enabling it while the port
# is blocked produces a DB Connect task that fails every interval and fills
# the internal logs.
# ---------------------------------------------------------------------------
[mssql_secdb]
connection_type = mssql
host = 10.20.30.41
port = 1433
database = secdb
identity = mssql_splunk_ro
readonly = true
timezone = UTC
fetch_size = 1000
disabled = 1
