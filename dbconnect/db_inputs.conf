# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/apps/splunk_app_db_connect/local/db_inputs.conf
#
# Scheduled table inputs.
#
# Mode matters here. Rising-column inputs checkpoint the last value seen and
# pull only newer rows, so a restart does not re-ingest the table - which
# would be both duplicate data and licence volume paid for twice. Batch mode
# re-queries a window each run, and is correct only where rows can change
# after insert, since a monotonic checkpoint would miss those updates.
#
# Index the checkpoint columns on the database side, or every poll becomes a
# full table scan.
# ---------------------------------------------------------------------------

# Application authentication events - feeds the SOC auth dashboards alongside
# the OS-level logins from the forwarders.
[mysql_app_auth_events]
connection = mysql_appdb
interval = */5 * * * *
index = db_input
sourcetype = mysql:auth_events
host = 10.20.30.40
mode = rising
query = SELECT id, event_time, username, source_ip, action, result, user_agent \
        FROM auth_events \
        WHERE id > ? \
        ORDER BY id ASC
tail_rising_column_name = id
tail_rising_column_number = 1
input_timestamp_column_number = 2
input_timestamp_column_name = event_time
max_rows = 10000
query_timeout = 30
disabled = 0

# Privileged database operations. GRANT and DDL changes are the database-layer
# equivalent of a privileged group membership change, and have no OS-level
# counterpart - this is data the forwarders cannot provide.
[mysql_privilege_changes]
connection = mysql_appdb
interval = */15 * * * *
index = db_input
sourcetype = mysql:privilege_changes
host = 10.20.30.40
mode = rising
query = SELECT audit_id, change_time, executed_by, statement_type, target_user, statement_text \
        FROM privilege_audit \
        WHERE audit_id > ? \
        ORDER BY audit_id ASC
tail_rising_column_name = audit_id
tail_rising_column_number = 1
input_timestamp_column_number = 2
input_timestamp_column_name = change_time
max_rows = 5000
query_timeout = 30
disabled = 0

# Failed application transactions. Batch rather than rising: a transaction can
# be updated to FAILED after it is inserted, so a rising checkpoint on the id
# would skip exactly the rows this input exists to collect.
[mysql_failed_transactions]
connection = mysql_appdb
interval = 0 * * * *
index = db_input
sourcetype = mysql:failed_transactions
host = 10.20.30.40
mode = batch
query = SELECT txn_id, txn_time, account_id, amount, failure_reason, source_ip \
        FROM transactions \
        WHERE status = 'FAILED' AND txn_time >= NOW() - INTERVAL 1 HOUR
input_timestamp_column_number = 2
input_timestamp_column_name = txn_time
max_rows = 10000
query_timeout = 60
disabled = 0

# ---------------------------------------------------------------------------
# SQL Server input. Disabled until the connection it depends on is enabled.
# ---------------------------------------------------------------------------
[mssql_security_events]
connection = mssql_secdb
interval = */10 * * * *
index = db_input
sourcetype = mssql:security_events
host = 10.20.30.41
mode = rising
query = SELECT event_id, event_time, login_name, host_name, event_type, succeeded \
        FROM dbo.security_events \
        WHERE event_id > ? \
        ORDER BY event_id ASC
tail_rising_column_name = event_id
tail_rising_column_number = 1
input_timestamp_column_number = 2
input_timestamp_column_name = event_time
max_rows = 10000
query_timeout = 30
disabled = 1
