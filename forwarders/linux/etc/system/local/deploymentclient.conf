# ---------------------------------------------------------------------------
# /opt/splunkforwarder/etc/system/local/deploymentclient.conf
#
# The standalone Splunk Enterprise instance also acts as the deployment
# server. Phoning home gives a check-in heartbeat per host independent of
# whether that host is currently producing log data - which is what separates
# "the endpoint is down" from "the input is broken".
# ---------------------------------------------------------------------------

[deployment-client]
clientName = linux-uf
phoneHomeIntervalInSecs = 60

[target-broker:deploymentServer]
targetUri = __INDEXER_HOST__:8089
