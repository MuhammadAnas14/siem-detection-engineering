# ---------------------------------------------------------------------------
# /opt/splunkforwarder/etc/system/local/inputs.conf   (LINUX UF)
#
# Every stanza pins its index explicitly so routing is decided at the edge and
# is visible in one file, rather than depending on indexer-side transforms.
#
# Covers both Debian-family (syslog, auth.log) and RHEL-family (messages,
# secure) layouts; stanzas for paths that do not exist on a given host are
# simply inert.
# ---------------------------------------------------------------------------

[default]
host = $decideOnStartup
index = linux

# --- General system log ----------------------------------------------------
[monitor:///var/log/syslog]
index = linux
disabled = 0
sourcetype = syslog
# Do not backfill ancient rotated logs on first start - that is licence volume
# spent on data nobody will search.
ignoreOlderThan = 48h

[monitor:///var/log/messages]
index = linux
disabled = 0
sourcetype = syslog
ignoreOlderThan = 48h

# --- Authentication --------------------------------------------------------
# Feeds the SSH brute-force, failed-access and root-session detections.
[monitor:///var/log/auth.log]
index = linux
disabled = 0
sourcetype = linux_secure
ignoreOlderThan = 48h

[monitor:///var/log/secure]
index = linux
disabled = 0
sourcetype = linux_secure
ignoreOlderThan = 48h

# --- Kernel ----------------------------------------------------------------
[monitor:///var/log/dmesg]
index = linux_audit
disabled = 0
sourcetype = linux_audit

# --- auditd ----------------------------------------------------------------
# Needs the splunk user in a group that can read the file; the installer
# handles that. Without it the input is configured but silently reads nothing.
[monitor:///var/log/audit/audit.log]
index = linux_audit
disabled = 0
sourcetype = linux_audit
ignoreOlderThan = 48h

# --- Package management ----------------------------------------------------
# Unexpected package installs are a cheap, high-signal persistence indicator.
[monitor:///var/log/dpkg.log]
index = linux_audit
disabled = 0
sourcetype = linux:package
ignoreOlderThan = 7d

[monitor:///var/log/yum.log]
index = linux_audit
disabled = 0
sourcetype = linux:package
ignoreOlderThan = 7d

# --- Cron ------------------------------------------------------------------
[monitor:///var/log/cron]
index = linux_audit
disabled = 0
sourcetype = cron
ignoreOlderThan = 48h

# --- Host posture snapshot --------------------------------------------------
[script://./bin/linux_host_health.sh]
index = linux_audit
disabled = 0
sourcetype = linux:hosthealth
interval = 300
