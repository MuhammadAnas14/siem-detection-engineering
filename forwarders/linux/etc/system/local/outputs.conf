# ---------------------------------------------------------------------------
# /opt/splunkforwarder/etc/system/local/outputs.conf   (LINUX UF)
# Forwards to the indexer over TLS on the S2S port.
# ---------------------------------------------------------------------------

[tcpout]
defaultGroup = default-autolb-group
disabled = false

# Queue on disk when the indexer is unreachable instead of dropping events.
# Sized for roughly an hour of outage on a typical server; raise it on hosts
# that generate more, or on links that fail for longer.
maxQueueSize = 64MB

# Wait for the indexer to confirm the write before discarding from the queue.
# Costs a little throughput and removes the silent-data-loss window on an
# indexer restart.
useACK = true

[tcpout:default-autolb-group]
server = __INDEXER_HOST__:__S2S_PORT__
disabled = false
# Rebalance every 30 s so one indexer does not accumulate a hot connection.
autoLBFrequency = 30

# --- TLS to the indexer ----------------------------------------------------
clientCert = $SPLUNK_HOME/etc/auth/client.pem
sslRootCAPath = $SPLUNK_HOME/etc/auth/cacert.pem
sslVersions = tls1.2
# Set to true and deploy a properly signed server certificate before treating
# the transport as trustworthy against an active attacker.
sslVerifyServerCert = false
useClientSSLCompression = true

[indexAndForward]
# A universal forwarder has no indexes of its own; this is explicit so the
# intent survives if the instance is ever upgraded to a heavy forwarder.
index = false
