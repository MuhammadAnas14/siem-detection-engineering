# ---------------------------------------------------------------------------
# %SPLUNK_HOME%\etc\system\local\inputs.conf   (WINDOWS UF)
#
# start_from = oldest + current_only = 0 means a forwarder restart resumes
# from its checkpoint rather than skipping whatever arrived while it was down.
# ---------------------------------------------------------------------------

[default]
host = $decideOnStartup
index = windows

# --- Core event logs --------------------------------------------------------
# Security carries the authentication, privilege, service, share and object
# access events most detections depend on.
[WinEventLog://Security]
index = windows
disabled = 0
sourcetype = WinEventLog:Security
start_from = oldest
current_only = 0
checkpointInterval = 5
renderXml = 0
# Resolve SIDs to account names at the forwarder - doing it at search time
# requires an AD lookup that usually is not configured.
evt_resolve_ad_obj = 1

[WinEventLog://System]
index = windows
disabled = 0
sourcetype = WinEventLog:System
start_from = oldest
current_only = 0
checkpointInterval = 5

[WinEventLog://Application]
index = windows
disabled = 0
sourcetype = WinEventLog:Application
start_from = oldest
current_only = 0
checkpointInterval = 5

# --- PowerShell -------------------------------------------------------------
# Requires Script Block Logging to be enabled; the installer sets the policy.
# Without it this input produces engine lifecycle noise and no script content.
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
index = windows_audit
disabled = 0
sourcetype = WinEventLog:Microsoft-Windows-PowerShell/Operational
start_from = oldest
current_only = 0
renderXml = 0

[WinEventLog://Windows PowerShell]
index = windows_audit
disabled = 0
sourcetype = WinEventLog:Microsoft-Windows-PowerShell
start_from = oldest
current_only = 0

# --- Endpoint protection ----------------------------------------------------
[WinEventLog://Microsoft-Windows-Windows Defender/Operational]
index = windows
disabled = 0
sourcetype = WinEventLog:Microsoft-Windows-Windows-Defender/Operational
start_from = oldest
current_only = 0

# --- Sysmon -----------------------------------------------------------------
# XML rendering preserves the structured fields; the parsing cost is paid at
# index time rather than in every search.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = sysmon
disabled = 0
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
renderXml = 1
start_from = oldest
current_only = 0

# --- Scheduled tasks --------------------------------------------------------
[WinEventLog://Microsoft-Windows-TaskScheduler/Operational]
index = windows_audit
disabled = 0
sourcetype = WinEventLog:TaskScheduler
start_from = oldest
current_only = 0

# --- Registry persistence keys ---------------------------------------------
# Scoped to the keys that matter. Monitoring whole hives generates enormous
# volume and buries the few changes worth seeing.
[WinRegMon://run_keys]
index = windows_audit
disabled = 0
sourcetype = WinRegistry
hive = \\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\.*
proc = .*
type = set|create|delete|rename
baseline = 1

[WinRegMon://services]
index = windows_audit
disabled = 0
sourcetype = WinRegistry
hive = \\REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Services\\.*
proc = .*
type = set|create|delete

[WinRegMon://winlogon]
index = windows_audit
disabled = 0
sourcetype = WinRegistry
hive = \\REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\.*
proc = .*
type = set|create|delete

# --- Host and performance telemetry ----------------------------------------
[WinHostMon://os]
index = windows_audit
disabled = 0
sourcetype = WinHostMon
type = OperatingSystem
interval = 600

[WinHostMon://service]
index = windows_audit
disabled = 0
sourcetype = WinHostMon
type = Service
interval = 600

[perfmon://CPU]
index = windows_audit
disabled = 0
sourcetype = Perfmon:CPU
object = Processor
counters = % Processor Time
instances = _Total
interval = 60

[perfmon://Memory]
index = windows_audit
disabled = 0
sourcetype = Perfmon:Memory
object = Memory
counters = Available MBytes; % Committed Bytes In Use
interval = 60

# --- Host posture snapshot --------------------------------------------------
[script://.\bin\windows_host_health.ps1]
index = windows_audit
disabled = 0
sourcetype = windows:hosthealth
interval = 300
