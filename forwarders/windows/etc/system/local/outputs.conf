# ---------------------------------------------------------------------------
# %SPLUNK_HOME%\etc\system\local\outputs.conf   (WINDOWS UF)
# Same load-balance group and TLS settings as the Linux forwarder; see that
# file for the reasoning behind useACK and the queue size.
# ---------------------------------------------------------------------------

[tcpout]
defaultGroup = default-autolb-group
disabled = false
maxQueueSize = 64MB
useACK = true

[tcpout:default-autolb-group]
server = __INDEXER_HOST__:__S2S_PORT__
disabled = false
autoLBFrequency = 30
clientCert = $SPLUNK_HOME\etc\auth\client.pem
sslRootCAPath = $SPLUNK_HOME\etc\auth\cacert.pem
sslVerifyServerCert = false
sslVersions = tls1.2
useClientSSLCompression = true

[tcpout-server://__INDEXER_HOST__:__S2S_PORT__]
disabled = false

[indexAndForward]
index = false
