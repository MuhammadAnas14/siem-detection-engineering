# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/system/local/indexes.conf
#
# Splunk's shipped defaults (main, _internal, _audit, ...) live in
# etc/system/default/indexes.conf and are left untouched; this file only adds
# the indexes this deployment owns.
#
#   frozenTimePeriodInSecs = 15552000  ->  180 days of retention
#   maxDataSize            = auto      ->  750 MB hot/warm buckets
#
# Data is split by OS and by signal-to-noise ratio rather than dumped into one
# index: retention, access control and search performance are all per-index,
# and the high-volume telemetry (perfmon, registry, sysmon) should not share a
# retention policy with authentication records.
#
# Apply with `splunk restart`, verify with `splunk list index`.
# ---------------------------------------------------------------------------

# ===========================================================================
# Linux estate
# ===========================================================================

# syslog + auth.log
[linux]
homePath   = $SPLUNK_DB/linux/db
coldPath   = $SPLUNK_DB/linux/colddb
thawedPath = $SPLUNK_DB/linux/thaweddb
maxDataSize = auto
maxHotBuckets = 6
maxWarmDBCount = 300
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 51200

# dmesg + auditd records. Separate from [linux] because auditd is an order of
# magnitude noisier and is rarely searched interactively.
[linux_audit]
homePath   = $SPLUNK_DB/linux_audit/db
coldPath   = $SPLUNK_DB/linux_audit/colddb
thawedPath = $SPLUNK_DB/linux_audit/thaweddb
maxDataSize = auto
maxHotBuckets = 4
maxWarmDBCount = 300
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 30720

# ===========================================================================
# Windows estate
# ===========================================================================

# WinEventLog Security / System / Application
[windows]
homePath   = $SPLUNK_DB/windows/db
coldPath   = $SPLUNK_DB/windows/colddb
thawedPath = $SPLUNK_DB/windows/thaweddb
maxDataSize = auto
maxHotBuckets = 6
maxWarmDBCount = 300
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 51200

# PowerShell Operational, Task Scheduler, registry monitoring, perfmon
[windows_audit]
homePath   = $SPLUNK_DB/windows_audit/db
coldPath   = $SPLUNK_DB/windows_audit/colddb
thawedPath = $SPLUNK_DB/windows_audit/thaweddb
maxDataSize = auto
maxHotBuckets = 4
maxWarmDBCount = 300
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 30720

# ===========================================================================
# Specialised sources
# ===========================================================================

# Sysmon process/network/registry telemetry. Shorter retention: high volume,
# and investigations that need it are almost always recent.
[sysmon]
homePath   = $SPLUNK_DB/sysmon/db
coldPath   = $SPLUNK_DB/sysmon/colddb
thawedPath = $SPLUNK_DB/sysmon/thaweddb
maxDataSize = auto
maxHotBuckets = 6
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 40960

# DNS query logs
[dns_logs]
homePath   = $SPLUNK_DB/dns_logs/db
coldPath   = $SPLUNK_DB/dns_logs/colddb
thawedPath = $SPLUNK_DB/dns_logs/thaweddb
maxDataSize = auto
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 30720

# Web / application access logs
[web_logs]
homePath   = $SPLUNK_DB/web_logs/db
coldPath   = $SPLUNK_DB/web_logs/colddb
thawedPath = $SPLUNK_DB/web_logs/thaweddb
maxDataSize = auto
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 30720

# Rows pulled in over JDBC by DB Connect
[db_input]
homePath   = $SPLUNK_DB/db_input/db
coldPath   = $SPLUNK_DB/db_input/colddb
thawedPath = $SPLUNK_DB/db_input/thaweddb
maxDataSize = auto
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 20480

# Alert results. Holds a year because it stores only detection output (tiny)
# and is what the long-range trend dashboards chart.
[siem_summary]
homePath   = $SPLUNK_DB/siem_summary/db
coldPath   = $SPLUNK_DB/siem_summary/colddb
thawedPath = $SPLUNK_DB/siem_summary/thaweddb
maxDataSize = auto
frozenTimePeriodInSecs = 31536000
maxTotalDataSizeMB = 10240
