# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/system/local/inputs.conf   (INDEXER)
#
# Opens the channels data arrives on: the S2S port the Universal Forwarders
# write to, the HTTP Event Collector for application and cloud-native sources,
# and network syslog for appliances that cannot run an agent.
# ---------------------------------------------------------------------------

[default]
host = splunk-indexer

# --- Forwarder-to-indexer (S2S) --------------------------------------------
# TLS is configured in server.conf -> [sslConfig]; the SSL stanza below pins
# the certificate this listener presents.
[splunktcp-ssl:__S2S_PORT__]
disabled = 0
connection_host = ip

[SSL]
serverCert = $SPLUNK_HOME/etc/auth/server.pem
requireClientCert = false

# Plaintext listener on the same port, kept disabled. Enable only to onboard a
# forwarder that cannot do TLS, and treat that as temporary.
[splunktcp://__S2S_PORT__]
disabled = 1
connection_host = ip

# --- Network syslog ---------------------------------------------------------
# Disabled by default. Splunk binding 514 directly is fine for a handful of
# appliances; at volume, put rsyslog in front writing to files and monitor
# those instead, so a Splunk restart cannot drop UDP datagrams.
[udp://514]
disabled = 1
index = linux
sourcetype = syslog
connection_host = ip
no_appending_timestamp = true

[tcp://514]
disabled = 1
index = linux
sourcetype = syslog
connection_host = ip

# --- HTTP Event Collector ---------------------------------------------------
[http]
disabled = 0
port = 8088
enableSSL = 1
dedicatedIoThreads = 2

[http://app_events]
disabled = 0
index = siem_summary
# Restrict which indexes this token may write to - a leaked token otherwise
# lets anyone inject events into any index.
indexes = siem_summary,linux,windows,web_logs,dns_logs
# Replaced with a real token by install/05_deploy_app.sh.
token = 00000000-0000-0000-0000-000000000000
