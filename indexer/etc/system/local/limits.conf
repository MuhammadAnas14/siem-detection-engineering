# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/system/local/limits.conf
#
# Tuned for a 4-core indexer running six real-time correlation searches
# alongside ad-hoc analyst work.
#
# Real-time searches each hold a scheduler slot for as long as they run. With
# default caps the scheduler starts skipping saved searches silently - the
# rule still shows as enabled in the UI while never executing. The OPS-04
# alert catches that, but raising the caps here prevents it.
#
# Scale these with core count. On a larger box, increase base_max_searches
# rather than max_searches_per_cpu.
# ---------------------------------------------------------------------------

[search]
max_searches_per_cpu = 2
base_max_searches = 6
# Keep dispatch artefacts from accumulating on disk.
ttl = 300
remote_ttl = 300

[realtime]
max_rt_search_multiplier = 2
# Indexed real-time is dramatically cheaper than true real-time and is
# accurate enough for alerting; the tradeoff is a few seconds of latency.
indexed_realtime_use_by_default = true
indexed_realtime_disk_sync_delay = 60

[scheduler]
max_searches_perc = 60
auto_summary_perc = 20
# Spread scheduled searches that share a cron expression instead of firing
# them all on the same second.
max_action_results = 50000

[subsearch]
maxout = 10000
maxtime = 120

[lookup]
max_memtable_bytes = 26214400
