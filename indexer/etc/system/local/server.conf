# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/system/local/server.conf   (INDEXER)
#
# Standalone topology: one instance carries the indexer, search head,
# deployment server and licence master roles. Suitable up to a few hundred
# forwarders; past that, split the search head out first.
# ---------------------------------------------------------------------------

[general]
serverName = splunk-indexer
# Replaced at deploy time. Shared secret for deployment-server and any future
# clustering; must match across instances that talk to each other.
pass4SymmKey = $7$CHANGE_ME_AT_DEPLOY
site = default

[sslConfig]
# TLS for the forwarder -> indexer channel and the management port.
enableSplunkdSSL = true
sslVersions = tls1.2
sslRootCAPath = $SPLUNK_HOME/etc/auth/cacert.pem
serverCert    = $SPLUNK_HOME/etc/auth/server.pem
sslPassword   = $7$CHANGE_ME_AT_DEPLOY
cipherSuite   = TLSv1.2:!eNULL:!aNULL:!MEDIUM:!LOW:!EXP

[lmpool:auto_generated_pool_enterprise]
description = auto_generated_pool_enterprise
quota = MAX
slaves = *
stack_id = enterprise

[diskUsage]
# Stop indexing before the volume fills completely. A full disk takes splunkd
# down hard and corrupts hot buckets; losing new data is the cheaper failure.
minFreeSpace = 10240

[license]
active_group = Enterprise

[kvstore]
disabled = false

[queue]
# Absorb forwarder bursts rather than applying backpressure down the pipeline.
maxSize = 500MB
