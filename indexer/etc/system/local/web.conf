# ---------------------------------------------------------------------------
# $SPLUNK_HOME/etc/system/local/web.conf
# Splunk Web, HTTPS only.
# ---------------------------------------------------------------------------

[settings]
httpport = 8000
enableSplunkWebSSL = true
privKeyPath = $SPLUNK_HOME/etc/auth/splunkweb/privkey.pem
serverCert  = $SPLUNK_HOME/etc/auth/splunkweb/cert.pem
sslVersions = tls1.2

# Analysts leave consoles open; 60 minutes idle is a reasonable compromise
# between losing an investigation and leaving a session unattended.
tools.sessions.timeout = 60

# Dashboards here refresh on 60 s / 5 m cycles.
max_view_cache_size = 300

# Replace the self-signed certificate before exposing this beyond a trusted
# network: generate a CSR, have it signed, and point the two paths above at
# the result.
